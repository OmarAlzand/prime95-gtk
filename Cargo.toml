[package]
name = "prime95-gtk"
version = "0.1.0"
edition = "2024"
description = "Native Linux interface for the Prime95 (mprime) CPU stress test"
license = "GPL-3.0-or-later"
repository = "https://github.com/OmarAlzand/prime95-gtk"
homepage = "https://github.com/OmarAlzand/prime95-gtk"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
async-channel = "2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
